---
name: Test

'on':
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check TypeScript source policy
        run: bun run check:typescript-sources

      - name: Typecheck
        run: bun run typecheck

      - name: Build packages
        run: bun run build

      - name: Run unit tests
        run: bun run test:unit

      - name: Run integration tests
        run: bun run test:integration

      - name: Pull Docker E2E image
        run: |
          image='oven/bun:1.4.0@sha256:'
          image="${image}5ff609364c049b54eb0ff560ec96319729a972078ef2c755d758f0c6ef89c2d6"
          docker pull "$image"

      - name: Run Docker E2E tests
        run: bun run test:e2e

      - name: Test packed core package
        run: bun run test:package

  native-distribution:
    name: Native standalone distribution E2E (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    env:
      KEPLER_EXPECTED_TARGET: ${{ matrix.target }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run native standalone distribution E2E
        run: bun --bun vitest run --project e2e tests/e2e/installation.test.ts
