---
name: Test

'on':
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Pull Docker E2E image
        run: |
          image='oven/bun:1.4.0@sha256:'
          image="${image}5ff609364c049b54eb0ff560ec96319729a972078ef2c755d758f0c6ef89c2d6"
          docker pull "$image"

      - name: Run test suite
        run: bun run test

      - name: Test packed core package
        run: bun run test:package
