---
name: Test

'on':
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check TypeScript source policy
        run: bun run check:typescript-sources

      - name: Typecheck
        run: bun run typecheck

      - name: Build packages
        run: bun run build

      - name: Run unit tests
        run: bun run test:unit

      - name: Run integration tests
        run: bun run test:integration

      - name: Build Docker E2E image
        run: docker build --file tests/e2e/Dockerfile --tag kepler-e2e:1.4.0 .

      - name: Run Docker E2E tests
        run: bun run test:e2e
        env:
          KEPLER_E2E_DOCKER_IMAGE: kepler-e2e:1.4.0

      - name: Test packed core package
        run: bun run test:package

  native-distribution:
    name: Native standalone distribution E2E (linux-x64)
    runs-on: ubuntu-24.04
    env:
      KEPLER_EXPECTED_TARGET: linux-x64
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build exact native archive for public CLI tests
        run: |
          source_commit="$(git rev-parse HEAD)"
          if [ "$source_commit" != "$GITHUB_SHA" ]; then
            printf 'Checkout %s does not match workflow source %s.\n' \
              "$source_commit" "$GITHUB_SHA" >&2
            exit 1
          fi
          version="$(bun scripts/package-version.ts package.json)"
          build_root="$RUNNER_TEMP/kepler-native-archive"
          binary="$build_root/kepler-$version-$KEPLER_EXPECTED_TARGET"
          archive="$build_root/kepler-$version-$KEPLER_EXPECTED_TARGET.tar.gz"
          mkdir -p "$build_root"
          bun scripts/build-release-binary.ts \
            --target "$KEPLER_EXPECTED_TARGET" \
            --output "$binary" \
            --require-clean
          bun scripts/package-target-archive.ts \
            --binary "$binary" \
            --target "$KEPLER_EXPECTED_TARGET" \
            --output "$archive"
          digest="$(bun scripts/archive-digest.ts "$archive")"
          printf '%s\n' "$digest  ${archive##*/}" > "$archive.sha256"
          {
            printf '%s=%s\n' KEPLER_VERIFIED_ARCHIVE_PATH "$archive"
            printf '%s=%s\n' KEPLER_VERIFIED_ARCHIVE_SHA256 "$digest"
            printf '%s=%s\n' KEPLER_EXPECTED_SOURCE_COMMIT "$source_commit"
          } >> "$GITHUB_ENV"

      - name: Run native standalone distribution E2E
        run: >-
          bun --bun vitest run --project e2e --no-file-parallelism
          tests/e2e/release-archive.test.ts
