---
name: Test

'on':
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Setup Node for the pinned Pi E2E host
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install actual pinned Pi E2E collaborators
        run: |
          host="$RUNNER_TEMP/kepler-pi-host"
          npm install --prefix "$host" --cache "$RUNNER_TEMP/kepler-pi-cache" \
            --userconfig "$RUNNER_TEMP/kepler-empty.npmrc" --ignore-scripts \
            --no-audit --no-fund --package-lock=false \
            '@earendil-works/pi-coding-agent@1.2.0' 'pi-subagents@0.76.1'
          pi_bin="$host/node_modules/.bin/pi"
          loader_root="$host/node_modules/pi-subagents"
          node_binary="$(command -v node)"
          node_version="$("$node_binary" --version)"
          if [ "$node_version" != "v22.19.0" ]; then
            printf 'Expected Node v22.19.0; found %s.\n' "$node_version" >&2
            exit 1
          fi
          sdk_entry="$host/node_modules/@earendil-works/pi-coding-agent/dist/index.js"
          if [ ! -f "$sdk_entry" ]; then
            printf 'Pinned Pi SDK entry was not installed:\n%s\n' \
              "$sdk_entry" >&2
            exit 1
          fi
          env_file="$GITHUB_ENV"
          {
            printf '%s=%s\n' KEPLER_PI_BINARY "$pi_bin"
            printf '%s=%s\n' KEPLER_PI_SUBAGENTS_ROOT "$loader_root"
            printf '%s=%s\n' KEPLER_PI_NODE_BINARY "$node_binary"
            printf '%s=%s\n' KEPLER_PI_SDK_ENTRY_PATH "$sdk_entry"
          } >> "$env_file"

      - name: Lint bootstrap installer
        run: shellcheck install.sh

      - name: Check TypeScript source policy
        run: bun run check:typescript-sources

      - name: Typecheck
        run: bun run typecheck

      - name: Build packages
        run: bun run build

      - name: Run unit tests
        run: bun run test:unit

      - name: Run integration tests
        run: bun run test:integration

      - name: Build Docker E2E image
        run: docker build --file tests/e2e/Dockerfile --tag kepler-e2e:1.4.0 .

      - name: Run Docker E2E tests
        run: bun run test:e2e
        env:
          KEPLER_E2E_DOCKER_IMAGE: kepler-e2e:1.4.0

      - name: Test packed core package
        run: bun run test:package

  native-distribution:
    name: Native standalone distribution E2E (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    env:
      KEPLER_EXPECTED_TARGET: ${{ matrix.target }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Setup Node for the pinned Pi E2E host
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install actual pinned Pi E2E collaborators
        run: |
          host="$RUNNER_TEMP/kepler-pi-host"
          npm install --prefix "$host" --cache "$RUNNER_TEMP/kepler-pi-cache" \
            --userconfig "$RUNNER_TEMP/kepler-empty.npmrc" --ignore-scripts \
            --no-audit --no-fund --package-lock=false \
            '@earendil-works/pi-coding-agent@1.2.0' 'pi-subagents@0.76.1'
          pi_bin="$host/node_modules/.bin/pi"
          loader_root="$host/node_modules/pi-subagents"
          node_binary="$(command -v node)"
          node_version="$("$node_binary" --version)"
          if [ "$node_version" != "v22.19.0" ]; then
            printf 'Expected Node v22.19.0; found %s.\n' "$node_version" >&2
            exit 1
          fi
          sdk_entry="$host/node_modules/@earendil-works/pi-coding-agent/dist/index.js"
          if [ ! -f "$sdk_entry" ]; then
            printf 'Pinned Pi SDK entry was not installed:\n%s\n' \
              "$sdk_entry" >&2
            exit 1
          fi
          env_file="$GITHUB_ENV"
          {
            printf '%s=%s\n' KEPLER_PI_BINARY "$pi_bin"
            printf '%s=%s\n' KEPLER_PI_SUBAGENTS_ROOT "$loader_root"
            printf '%s=%s\n' KEPLER_PI_NODE_BINARY "$node_binary"
            printf '%s=%s\n' KEPLER_PI_SDK_ENTRY_PATH "$sdk_entry"
          } >> "$env_file"

      - name: Build exact native archive for public CLI tests
        run: |
          source_commit="$(git rev-parse HEAD)"
          if [ "$source_commit" != "$GITHUB_SHA" ]; then
            printf 'Checkout %s does not match workflow source %s.\n' \
              "$source_commit" "$GITHUB_SHA" >&2
            exit 1
          fi
          version="$(bun scripts/package-version.ts package.json)"
          build_root="$RUNNER_TEMP/kepler-native-archive"
          binary="$build_root/kepler-$version-$KEPLER_EXPECTED_TARGET"
          archive="$build_root/kepler-$version-$KEPLER_EXPECTED_TARGET.tar.gz"
          mkdir -p "$build_root"
          bun scripts/build-release-binary.ts \
            --target "$KEPLER_EXPECTED_TARGET" \
            --output "$binary" \
            --require-clean
          bun scripts/package-target-archive.ts \
            --binary "$binary" \
            --target "$KEPLER_EXPECTED_TARGET" \
            --output "$archive"
          digest="$(bun scripts/archive-digest.ts "$archive")"
          printf '%s\n' "$digest  ${archive##*/}" > "$archive.sha256"
          {
            printf '%s=%s\n' KEPLER_VERIFIED_ARCHIVE_PATH "$archive"
            printf '%s=%s\n' KEPLER_VERIFIED_ARCHIVE_SHA256 "$digest"
            printf '%s=%s\n' KEPLER_EXPECTED_SOURCE_COMMIT "$source_commit"
          } >> "$GITHUB_ENV"

      - name: Run native standalone distribution E2E
        run: >-
          bun --bun vitest run --project e2e --no-file-parallelism
          tests/e2e/installation.test.ts tests/e2e/release-archive.test.ts
          tests/e2e/bootstrap-safety.test.ts tests/e2e/dev-package.test.ts
