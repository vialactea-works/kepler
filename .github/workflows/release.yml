name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_core:
        description: Publish the current core package version to GitHub Packages
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  check-version:
    name: Check if version changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.version-check.outputs.should_release }}
      should_publish_core: >-
        ${{ steps.version-check.outputs.should_publish_core }}
      version: ${{ steps.read-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Read package.json version
        id: read-version
        run: |
          VERSION="$(bun scripts/package-version.ts package.json)"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version should be released
        id: version-check
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "should_publish_core=$PUBLISH_CORE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="v$RELEASE_VERSION"

          # Most recent published release, empty if none exists yet.
          LATEST_RELEASE=$(gh release list \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName' || echo "")

          # No version change: package.json matches the latest published
          # release. Skip cleanly — no tag, no build, no publish.
          if [ "$TAG" = "$LATEST_RELEASE" ]; then
            printf 'Version %s is already released as %s.\n' \
              "$RELEASE_VERSION" "$TAG"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "should_publish_core=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # We intend to release $TAG. If the tag already exists on the remote
          # but isn't the latest release, it's a leftover from a run that
          # failed after tagging but before publishing. Fail loudly with a
          # recovery hint rather than pushing it again later (which errors
          # cryptically) or reusing it (which would leave the tag pointing at
          # a different commit than the artifacts built by this run).
          if git ls-remote --exit-code --tags origin \
            "refs/tags/$TAG" >/dev/null 2>&1; then
            printf 'Error: tag %s already exists on the remote but ' "$TAG" >&2
            printf 'has no matching release.\n' >&2
            echo "An earlier release run failed after creating the tag." >&2
            echo "Delete the tag and re-run:  git push origin --delete $TAG" >&2
            exit 1
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "should_publish_core=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_CORE: ${{ inputs.publish_core }}
          RELEASE_VERSION: ${{ steps.read-version.outputs.version }}

  verify:
    name: Verify workspace
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Setup Node for the pinned Pi E2E host
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install actual pinned Pi E2E collaborators
        run: |
          host="$RUNNER_TEMP/kepler-pi-host"
          npm install --prefix "$host" --cache "$RUNNER_TEMP/kepler-pi-cache" \
            --userconfig "$RUNNER_TEMP/kepler-empty.npmrc" --ignore-scripts \
            --no-audit --no-fund --package-lock=false \
            '@earendil-works/pi-coding-agent@1.2.0' 'pi-subagents@0.76.1'
          pi_bin="$host/node_modules/.bin/pi"
          loader_root="$host/node_modules/pi-subagents"
          node_binary="$(command -v node)"
          node_version="$("$node_binary" --version)"
          if [ "$node_version" != "v22.19.0" ]; then
            printf 'Expected Node v22.19.0; found %s.\n' "$node_version" >&2
            exit 1
          fi
          sdk_entry="$host/node_modules/@earendil-works/pi-coding-agent/dist/index.js"
          if [ ! -f "$sdk_entry" ]; then
            printf 'Pinned Pi SDK entry was not installed:\n%s\n' \
              "$sdk_entry" >&2
            exit 1
          fi
          env_file="$GITHUB_ENV"
          {
            printf '%s=%s\n' KEPLER_PI_BINARY "$pi_bin"
            printf '%s=%s\n' KEPLER_PI_SUBAGENTS_ROOT "$loader_root"
            printf '%s=%s\n' KEPLER_PI_NODE_BINARY "$node_binary"
            printf '%s=%s\n' KEPLER_PI_SDK_ENTRY_PATH "$sdk_entry"
          } >> "$env_file"

      - name: Compile version checker
        run: |
          bun build --compile \
            scripts/check-versions.ts \
            --outfile "$RUNNER_TEMP/check-versions"

      - name: Check synchronized package versions
        run: |
          "$RUNNER_TEMP/check-versions"

      - name: Check TypeScript source policy
        run: bun run check:typescript-sources

      - name: Typecheck
        run: bun run typecheck

      - name: Build packages
        run: bun run build

      - name: Run unit tests
        run: bun run test:unit

      - name: Run integration tests
        run: bun run test:integration

      - name: Build Docker E2E image
        run: docker build --file tests/e2e/Dockerfile --tag kepler-e2e:1.4.0 .

      - name: Run Docker E2E tests
        run: bun run test:e2e
        env:
          KEPLER_E2E_DOCKER_IMAGE: kepler-e2e:1.4.0

      - name: Test packed core package
        run: bun run test:package

      - name: Run ShellCheck
        run: shellcheck install.sh

  native-distribution:
    name: Native target archive E2E (${{ matrix.target }})
    needs:
      - check-version
      - verify
    if: >-
      ${{
        needs.check-version.outputs.should_release == 'true' ||
        needs.check-version.outputs.should_publish_core == 'true'
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    env:
      KEPLER_EXPECTED_TARGET: ${{ matrix.target }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Setup Node for the pinned Pi E2E host
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install actual pinned Pi E2E collaborators
        run: |
          host="$RUNNER_TEMP/kepler-pi-host"
          npm install --prefix "$host" --cache "$RUNNER_TEMP/kepler-pi-cache" \
            --userconfig "$RUNNER_TEMP/kepler-empty.npmrc" --ignore-scripts \
            --no-audit --no-fund --package-lock=false \
            '@earendil-works/pi-coding-agent@1.2.0' 'pi-subagents@0.76.1'
          pi_bin="$host/node_modules/.bin/pi"
          loader_root="$host/node_modules/pi-subagents"
          node_binary="$(command -v node)"
          node_version="$("$node_binary" --version)"
          if [ "$node_version" != "v22.19.0" ]; then
            printf 'Expected Node v22.19.0; found %s.\n' "$node_version" >&2
            exit 1
          fi
          sdk_entry="$host/node_modules/@earendil-works/pi-coding-agent/dist/index.js"
          if [ ! -f "$sdk_entry" ]; then
            printf 'Pinned Pi SDK entry was not installed:\n%s\n' \
              "$sdk_entry" >&2
            exit 1
          fi
          env_file="$GITHUB_ENV"
          {
            printf '%s=%s\n' KEPLER_PI_BINARY "$pi_bin"
            printf '%s=%s\n' KEPLER_PI_SUBAGENTS_ROOT "$loader_root"
            printf '%s=%s\n' KEPLER_PI_NODE_BINARY "$node_binary"
            printf '%s=%s\n' KEPLER_PI_SDK_ENTRY_PATH "$sdk_entry"
          } >> "$env_file"

      - name: Build packages
        run: bun run build

      - name: Build exact native archive for public CLI tests
        run: |
          source_commit="$(git rev-parse HEAD)"
          if [ "$source_commit" != "$GITHUB_SHA" ]; then
            printf 'Checkout %s does not match workflow source %s.\n' \
              "$source_commit" "$GITHUB_SHA" >&2
            exit 1
          fi
          version="$(bun scripts/package-version.ts package.json)"
          build_root="$RUNNER_TEMP/kepler-native-archive"
          binary="$build_root/kepler-$version-$KEPLER_EXPECTED_TARGET"
          archive="$build_root/kepler-$version-$KEPLER_EXPECTED_TARGET.tar.gz"
          mkdir -p "$build_root"
          bun scripts/build-release-binary.ts \
            --target "$KEPLER_EXPECTED_TARGET" \
            --output "$binary" \
            --require-clean
          bun scripts/package-target-archive.ts \
            --binary "$binary" \
            --target "$KEPLER_EXPECTED_TARGET" \
            --output "$archive"
          digest="$(bun scripts/archive-digest.ts "$archive")"
          printf '%s\n' "$digest  ${archive##*/}" > "$archive.sha256"
          {
            printf '%s=%s\n' KEPLER_VERIFIED_ARCHIVE_PATH "$archive"
            printf '%s=%s\n' KEPLER_VERIFIED_ARCHIVE_SHA256 "$digest"
            printf '%s=%s\n' KEPLER_EXPECTED_SOURCE_COMMIT "$source_commit"
          } >> "$GITHUB_ENV"

      - name: Run native target archive E2E
        run: >-
          bun --bun vitest run --project e2e --no-file-parallelism
          tests/e2e/installation.test.ts tests/e2e/release-archive.test.ts
          tests/e2e/bootstrap-safety.test.ts tests/e2e/dev-package.test.ts

      - name: Upload tested native target archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kepler-target-archive-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/kepler-native-archive/kepler-*.tar.gz
            ${{ runner.temp }}/kepler-native-archive/kepler-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  tag:
    name: Create version tag
    needs:
      - check-version
      - verify
      - native-distribution
      - verify-release-assets
      - publish-core
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Create and push tag
        run: |
          TAG="v$RELEASE_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          if [ "$CHECKED_OUT_SHA" != "$GITHUB_SHA" ]; then
            printf 'Checked out %s but workflow event identifies %s.\n' \
              "$CHECKED_OUT_SHA" "$GITHUB_SHA" >&2
            exit 1
          fi
          git tag "$TAG" "$GITHUB_SHA"
          COMMIT_SHA="$(git rev-parse "$TAG")"
          gh api "repos/$GH_REPO/git/refs" \
            --method POST \
            -f "ref=refs/tags/$TAG" \
            -f "sha=$COMMIT_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.check-version.outputs.version }}

  package:
    name: Package verified native archives
    needs:
      - check-version
      - native-distribution
    if: >-
      ${{
        needs.check-version.outputs.should_release == 'true' ||
        needs.check-version.outputs.should_publish_core == 'true'
      }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download tested native target archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: kepler-target-archive-*
          path: artifacts
          merge-multiple: true

      - name: Verify tested native archive digests and stage release assets
        run: |
          checksum_count="$(
            find artifacts -maxdepth 1 -type f \
              -name 'kepler-*.tar.gz.sha256' | wc -l
          )"
          if [ "$checksum_count" -ne 4 ]; then
            printf 'Expected four native archive test digests; found %s.\n' \
              "$checksum_count" >&2
            exit 1
          fi
          for checksum in artifacts/kepler-*.tar.gz.sha256; do
            (cd artifacts && sha256sum --check "${checksum##*/}")
          done
          mkdir -p release-assets
          mv artifacts/kepler-*.tar.gz release-assets/

      - name: Pack the core package
        run: |
          bun run build:core
          PACKAGE_VERSION="$(
            bun scripts/package-version.ts \
              packages/core/package.json
          )"
          PACKAGE_ARCHIVE="kepler-core-${PACKAGE_VERSION}.tgz"
          (
            cd packages/core
            bun pm pack --filename "$GITHUB_WORKSPACE/$PACKAGE_ARCHIVE" --quiet
          )
          printf 'Created %s\n' "$PACKAGE_ARCHIVE"

      - name: Stage the Core tarball
        run: mv kepler-core-*.tgz release-assets/

      - name: Create release provenance and checksums
        run: |
          VERSION="$(bun scripts/package-version.ts package.json)"
          bun scripts/release-assets.ts \
            --mode create \
            --assets release-assets \
            --version "$VERSION" \
            --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: release-assets/*

      - name: Upload complete verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  verify-release-assets:
    name: Verify immutable release assets
    needs:
      - check-version
      - package
    if: >-
      ${{
        needs.check-version.outputs.should_release == 'true' ||
        needs.check-version.outputs.should_publish_core == 'true'
      }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-assets
          path: release-assets

      - name: Verify release provenance and checksums
        run: |
          bun scripts/release-assets.ts \
            --mode verify \
            --assets release-assets \
            --version "$RELEASE_VERSION" \
            --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
        env:
          RELEASE_VERSION: ${{ needs.check-version.outputs.version }}

      - name: Verify GitHub artifact attestations
        run: |
          for asset in release-assets/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
          done
        env:
          GH_TOKEN: ${{ github.token }}

  publish-core:
    name: Publish core package to GitHub Packages
    needs:
      - check-version
      - verify
      - package
      - verify-release-assets
    if: >-
      ${{
        always() &&
        needs.check-version.outputs.should_publish_core == 'true' &&
        needs.verify.result == 'success' &&
        (
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.publish_core &&
            needs.package.result == 'success' &&
            needs.verify-release-assets.result == 'success'
          ) ||
          (
            needs.check-version.outputs.should_release == 'true' &&
            needs.package.result == 'success' &&
            needs.verify-release-assets.result == 'success'
          )
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x
          registry-url: https://npm.pkg.github.com
          scope: '@vialactea-works'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-assets
          path: release-assets

      - name: Publish or reconcile exact Core tarball
        run: |
          bun scripts/reconcile-core-package.ts \
            --assets release-assets \
            --tarball "release-assets/kepler-core-$RELEASE_VERSION.tgz" \
            --package-name "@vialactea-works/kepler-core" \
            --version "$RELEASE_VERSION" \
            --source-commit "$GITHUB_SHA" \
            --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.check-version.outputs.version }}

  publish:
    name: Publish release
    needs:
      - check-version
      - package
      - verify-release-assets
      - publish-core
      - tag
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Download verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-assets
          path: release-assets

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Verify release provenance and checksums
        run: |
          bun scripts/release-assets.ts \
            --mode verify \
            --assets release-assets \
            --version "$RELEASE_VERSION" \
            --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
        env:
          RELEASE_VERSION: ${{ needs.check-version.outputs.version }}

      - name: Verify GitHub artifact attestations
        run: |
          for asset in release-assets/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: List release assets
        run: ls -la release-assets

      - name: Create GitHub Release
        run: |
          VERSION="$RELEASE_VERSION"
          NOTES_FILE="docs/releases/${VERSION}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "Release notes file not found: $NOTES_FILE." >&2
            echo "Add this versioned file before publishing v$VERSION." >&2
            exit 1
          fi

          gh release create "v$VERSION" \
            release-assets/* \
            --title "v$VERSION" \
            --notes-file "$NOTES_FILE"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.check-version.outputs.version }}
